<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,400;1,700&family=Pinyon+Script&family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,900;1,6..96,700&display=swap" rel="stylesheet">
    <title>May Kyal Lay</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="loader" style="position:fixed;inset:0;z-index:9999;background-color:#f6f1e8;display:flex;align-items:center;justify-content:center;transition:opacity 0.5s ease;">
      <canvas id="loaderCanvas" style="position:absolute;inset:0;"></canvas>
      <p style="position:relative;font-family:'Caveat',cursive;font-size:2.5rem;color:#5a1e24;z-index:1;">Loading...</p>
    </div>
    <script>
      (function () {
        var canvas = document.getElementById('loaderCanvas')
        var ctx = canvas.getContext('2d')
        var colors = ['#5a1e24', '#c8929e', '#e11d48', '#f43f5e', '#fb7185', '#fda4af']
        var hearts = []
        var running = true
        var rafId

        function resize() {
          canvas.width = window.innerWidth
          canvas.height = window.innerHeight
        }
        resize()
        window.addEventListener('resize', resize)

        function spawn(h) {
          h.x = Math.random() * canvas.width
          h.y = -20 - Math.random() * canvas.height * 0.5
          h.size = Math.random() * 14 + 8
          h.speedY = Math.random() * 1.5 + 1
          h.sway = Math.random() * 1.5 + 0.5
          h.phase = Math.random() * Math.PI * 2
          h.rotation = (Math.random() - 0.5) * 40
          h.rotationSpeed = (Math.random() - 0.5) * 2
          h.color = colors[Math.floor(Math.random() * colors.length)]
          h.opacity = Math.random() * 0.5 + 0.5
        }

        for (var i = 0; i < 40; i++) {
          var h = {}
          spawn(h)
          h.y = Math.random() * canvas.height
          hearts.push(h)
        }

        function drawHeart(x, y, size, color, rotation, opacity) {
          ctx.save()
          ctx.translate(x, y)
          ctx.rotate((rotation * Math.PI) / 180)
          ctx.globalAlpha = opacity
          ctx.fillStyle = color
          ctx.beginPath()
          var topCurveHeight = size * 0.3
          ctx.moveTo(0, topCurveHeight)
          ctx.bezierCurveTo(-size / 2, -topCurveHeight, -size, topCurveHeight / 3, 0, size)
          ctx.bezierCurveTo(size, topCurveHeight / 3, size / 2, -topCurveHeight, 0, topCurveHeight)
          ctx.closePath()
          ctx.fill()
          ctx.restore()
        }

        function animate() {
          if (!running) return
          ctx.clearRect(0, 0, canvas.width, canvas.height)
          hearts.forEach(function (h) {
            h.y += h.speedY
            h.phase += 0.03
            h.rotation += h.rotationSpeed
            var x = h.x + Math.sin(h.phase) * h.sway * 10
            drawHeart(x, h.y, h.size, h.color, h.rotation, h.opacity)
            if (h.y - h.size > canvas.height) spawn(h)
          })
          rafId = requestAnimationFrame(animate)
        }
        animate()

        function hide() {
          if (!running) return
          running = false
          cancelAnimationFrame(rafId)
          var loader = document.getElementById('loader')
          loader.style.opacity = '0'
          setTimeout(function () { loader.remove() }, 500)
        }

        window.addEventListener('load', hide)
        setTimeout(hide, 10000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
